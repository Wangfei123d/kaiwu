        <button class="skill active" data-skill="文档撰写" data-category="写作" data-origin="Agent" data-enabled="true" data-description="按用户要求组织、撰写或改写内容，并根据指定格式交付。" data-uses="Word 文档,Markdown,项目方案" data-body="# 文档撰写\n\n## 工作方式\n- 先识别目标读者与交付格式。\n- 按请求组织结构，避免冗长铺垫。\n- 用户指定文件格式时，生成对应文件。\n- 交付前检查内容、文件名和格式。\n\n## 输出\n清晰、可直接使用的最终文稿。"><i class="skill-icon"><svg><use href="#i-file"/></svg></i><span class="skill-info"><b class="skill-name">文档撰写</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="会议纪要" data-category="写作" data-origin="Agent" data-enabled="true" data-description="从会议记录中提炼主题、结论、待办事项和负责人。" data-uses="会议记录,行动项,周报" data-body="# 会议纪要\n\n## 提炼规则\n- 区分讨论内容与最终决议。\n- 将待办写成“事项 / 负责人 / 时间”。\n- 未明确的信息标记待确认，不要推测。\n\n## 输出结构\n主题、结论、行动项。"><i class="skill-icon"><svg><use href="#i-book"/></svg></i><span class="skill-info"><b class="skill-name">会议纪要</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="资料研究" data-category="资料" data-origin="Agent" data-enabled="true" data-description="拆解研究问题，比较可靠来源，并分开呈现事实与推断。" data-uses="资料调研,来源核验,竞品比较" data-body="# 资料研究\n\n## 研究流程\n- 明确问题和时间范围。\n- 优先使用权威、近期来源。\n- 区分来源事实、分析和不确定内容。\n- 标注来源链接。\n\n## 输出\n先给结论，再给依据。"><i class="skill-icon"><svg><use href="#i-globe"/></svg></i><span class="skill-info"><b class="skill-name">资料研究</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="代码修复" data-category="开发" data-origin="内置" data-enabled="true" data-description="复现并定位代码问题，完成范围最小的修复。" data-uses="调试,错误修复,代码审查" data-body="# 代码修复\n\n## 工作方式\n- 先定位问题和受影响范围。\n- 尽量采用小而完整的修复。\n- 不运行用户未要求的测试。\n- 说明修改内容和验证范围。"><i class="skill-icon"><svg><use href="#i-code"/></svg></i><span class="skill-info"><b class="skill-name">代码修复</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="短剧创作" data-category="写作" data-origin="Agent" data-enabled="true" data-description="按人物设定、场景和时长要求编写短剧内容。" data-uses="剧本,分镜,对白" data-body="# 短剧创作\n\n## 创作约束\n- 保持人物设定和动机一致。\n- 按场景组织动作与对白。\n- 尊重用户指定的时长、题材和格式。\n- 不擅自扩写未要求的部分。"><i class="skill-icon"><svg><use href="#i-pen"/></svg></i><span class="skill-info"><b class="skill-name">短剧创作</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="图片提示词" data-category="其他" data-origin="Agent" data-enabled="false" data-description="将画面想法转换成清楚、可执行的图像生成提示词。" data-uses="图像生成,风格描述,画面构图" data-body="# 图片提示词\n\n用主体、场景、构图、光线和风格表达画面。保持用户指定的视觉重点，避免堆叠相互冲突的形容词。"><i class="skill-icon"><svg><use href="#i-spark"/></svg></i><span class="skill-info"><b class="skill-name">图片提示词</b><small class="skill-meta"><i class="tiny-dot off"></i><span>内置</span></small></span><span class="skill-state">○</span></button>
        <button class="skill" data-skill="表格分析" data-category="资料" data-origin="内置" data-enabled="true" data-description="检查表格数据结构，汇总变化并制作可读的分析结果。" data-uses="数据整理,趋势分析,图表" data-body="# 表格分析\n\n检查字段和数据质量；说明计算口径；用简洁表格或图表呈现关键结果。"><i class="skill-icon"><svg><use href="#i-grid"/></svg></i><span class="skill-info"><b class="skill-name">表格分析</b><small class="skill-meta"><i class="tiny-dot"></i><span>内置</span></small></span><span class="skill-state">✓</span></button>
        <button class="skill" data-skill="界面设计" data-category="开发" data-origin="Agent" data-enabled="true" data-description="按开物 UI 设计准则制作简洁、清楚、有细腻动效的界面。" data-uses="界面,HTML 预览,交互设计" data-body="# 界面设计\n\n- 减少解释性文字，让内容直接表达。\n- 常见操作优先使用矢量图标。\n- 保持布局简洁并复用产品设计语言。\n- 使用克制的状态动效和自然缓动。\n- 支持键盘操作与减少动态效果偏好。"><i class="skill-icon"><svg><use href="#i-spark"/></svg></i><span class="skill-info"><b class="skill-name">界面设计</b><small class="skill-meta"><i class="tiny-dot"></i><span>项目</span></small></span><span class="skill-state">✓</span></button>
      </div>
      <div class="list-foot"><svg><use href="#i-spark"/></svg><span>Agent 创建 · 按需匹配</span></div>
    </aside>
    <section class="detail" id="detail">
      <div class="detail-top">
        <button class="icon-btn mobile-back" id="backToList" aria-label="返回技能列表" title="返回" style="display:none"><svg style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
        <div class="hero-icon"><svg id="heroGlyph"><use href="#i-file"/></svg></div>
        <div class="detail-title"><div class="title-line"><h2 id="skillTitle">文档撰写</h2><span class="source" id="sourceBadge">内置</span></div><p class="detail-sub" id="skillSummary">按用户要求组织、撰写或改写内容，并根据指定格式交付。</p></div>
        <div class="detail-actions">
          <button class="icon-btn" id="previewSkill" aria-label="试运行 Skill" title="试运行"><svg><use href="#i-run"/></svg></button>
          <button class="icon-btn" id="toggleCurrent" aria-label="启用或停用 Skill" title="启用 Skill"><svg><use href="#i-check"/></svg></button>
          <button class="icon-btn" id="moreSkill" aria-label="更多操作" title="更多"><svg><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
      </div>
      <div class="detail-scroll">
        <div class="properties">
          <div class="column">
            <div class="section"><div class="section-head"><svg><use href="#i-pen"/></svg><span>用途</span></div><textarea class="description" id="description"></textarea></div>
            <div class="section"><div class="section-head"><svg><use href="#i-spark"/></svg><span>适用任务</span></div><div class="chips" id="useChips"></div></div>
            <div class="section">
              <div class="section-head"><svg><use href="#i-file"/></svg><span>指令</span><span class="spacer"></span><span class="source">SKILL.md</span></div>
              <div class="editor"><div class="editor-bar"><svg class="file-icon"><use href="#i-file"/></svg><strong>SKILL.md</strong><span class="spacer"></span><span>Markdown</span></div><div class="editor-body" id="skillBody" contenteditable="true" spellcheck="false"></div></div>
            </div>
          </div>
          <aside class="side-stack">
            <div class="section"><div class="section-head"><svg><use href="#i-box"/></svg><span>来源</span></div><div class="source-path"><svg><use href="#i-file"/></svg><span id="skillPath">内置 / writing / document</span></div></div>
            <div class="section"><div class="section-head"><svg><use href="#i-tune"/></svg><span>自动匹配</span><span class="spacer"></span><i class="switch on" id="skillAuto" role="switch" aria-checked="true" tabindex="0"></i></div><div class="match-box"><div class="match-top"><svg><use href="#i-spark"/></svg><strong>最近匹配</strong><span class="pill">已调用</span></div><div class="match-example">“把这份调研整理成 Word 简报”<small>文档撰写 · 资料研究</small></div></div></div>
            <div class="section"><div class="section-head"><svg><use href="#i-run"/></svg><span>试运行</span></div><textarea id="runInput" class="run-input" placeholder="输入一个任务"></textarea><button class="status-btn" id="runInline" style="margin-top:6px"><svg><use href="#i-run"/></svg>试运行</button><div class="run-output" id="runOutput"><div class="run-output-title"><svg><use href="#i-check"/></svg>匹配结果</div><div class="run-tags" id="runTags"></div></div></div>
          </aside>
        </div>
      </div>
      <footer class="detail-foot"><span class="saved"><svg><use href="#i-check"/></svg><span id="saveState">已保存</span></span><span class="spacer"></span><button class="icon-btn" id="openFolder" aria-label="打开位置" title="打开位置"><svg><use href="#i-import"/></svg></button><button class="status-btn primary" id="saveSkill"><svg><use href="#i-save"/></svg>保存</button></footer>
    </section>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const list = $('#skillList'), cards = $$('.skill', list), workspace = $('#workspace'), toast = $('#toast');
  let selected = cards[0], currentFilter = '全部', activeCategory = '全部', toastTimer;
  function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1700); }
  function iconFor(card) { const icon = $('use', $('.skill-icon', card)); return icon?.getAttribute('href') || '#i-spark'; }
  function renderDetail(card) {
    selected = card;
    cards.forEach(item => item.classList.toggle('active', item === card));
    cards.forEach(item => { const label = $('.skill-meta span', item); if (label) label.textContent = item.dataset.origin === 'Agent' ? 'Agent 创建' : '内置'; });
    const name = card.dataset.skill, enabled = card.dataset.enabled === 'true';
    $('#skillTitle').textContent = name;
    $('#skillSummary').textContent = card.dataset.description;
    $('#sourceBadge').textContent = card.dataset.origin === 'Agent' ? 'Agent 创建' : '内置';
    $('#heroGlyph').setAttribute('href', iconFor(card));
    $('#description').value = card.dataset.description;
    $('#skillBody').textContent = card.dataset.body;
    $('#useChips').replaceChildren(...card.dataset.uses.split(',').map(label => { const chip=document.createElement('span');chip.className='chip';chip.innerHTML='<svg><use href="#i-check"/></svg>';chip.append(document.createTextNode(label));return chip; }));
    $('#skillPath').textContent = card.dataset.origin === 'Agent' ? `Agent / skills / ${name}` : `内置 / ${card.dataset.category} / ${name}`;
    $('#toggleCurrent').title = enabled ? '停用 Skill' : '启用 Skill';
    $('#toggleCurrent').setAttribute('aria-label', $('#toggleCurrent').title);
    $('#toggleCurrent').classList.toggle('primary', enabled);
    $('#skillAuto').classList.toggle('on', enabled);
    $('#skillAuto').setAttribute('aria-checked', String(enabled));
    if (innerWidth <= 760) workspace.classList.add('detail-open');
  }
  function visibleCards() {
    const query = $('#skillSearch').value.trim().toLowerCase();
    cards.forEach(card => {
      const matches = `${card.dataset.skill} ${card.dataset.description} ${card.dataset.uses}`.toLowerCase().includes(query);
      const category = activeCategory === '全部' || (activeCategory === 'Agent 创建' ? card.dataset.origin === 'Agent' : card.dataset.category === activeCategory);
      const enabled = currentFilter === '全部' || (card.dataset.enabled === 'true') === (currentFilter === '已启用');
      card.classList.toggle('hidden', !(matches && category && enabled));
    });
    $('#visibleCount').textContent = String(cards.filter(card => !card.classList.contains('hidden')).length).padStart(2,'0');
    if (selected.classList.contains('hidden')) { const next=cards.find(card => !card.classList.contains('hidden')); if(next) renderDetail(next); }
  }
  cards.forEach(card => card.addEventListener('click', () => renderDetail(card)));
  $$('.rail-item[data-category]').forEach(button => button.addEventListener('click', () => {
    $$('.rail-item[data-category]').forEach(item => item.classList.toggle('active', item === button)); activeCategory=button.dataset.category; visibleCards();
  }));
  $$('.filter').forEach(button => button.addEventListener('click', () => {
    $$('.filter').forEach(item => item.classList.toggle('active', item === button)); currentFilter=button.dataset.filter; visibleCards();
  }));
  $('#skillSearch').addEventListener('input', visibleCards);
  $('#toggleCurrent').addEventListener('click', () => {
    selected.dataset.enabled = String(selected.dataset.enabled !== 'true');
    const on=selected.dataset.enabled === 'true';
    $('.tiny-dot', selected).classList.toggle('off', !on); $('.skill-state', selected).textContent=on?'✓':'○';
    $('#toggleCurrent').title=on?'停用 Skill':'启用 Skill'; $('#toggleCurrent').setAttribute('aria-label',$('#toggleCurrent').title);
    $('#skillAuto').classList.toggle('on',on); $('#skillAuto').setAttribute('aria-checked',String(on)); visibleCards(); notify(on?'Skill 已启用':'Skill 已停用');
  });
  $('#skillAuto').addEventListener('click', () => $('#toggleCurrent').click());
  $('#skillAuto').addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); $('#toggleCurrent').click(); } });
  function switchAuto() { $('#autoMatch .switch').classList.toggle('on'); $('#autoMatch').setAttribute('aria-pressed',String($('#autoMatch .switch').classList.contains('on'))); notify($('#autoMatch .switch').classList.contains('on')?'已开启自动匹配':'已关闭自动匹配'); }
  $('#autoMatch').addEventListener('click',switchAuto);
  $('#saveSkill').addEventListener('click',()=>{selected.dataset.description=$('#description').value;selected.dataset.body=$('#skillBody').innerText;$('#skillSummary').textContent=$('#description').value;notify('已保存');$('#saveState').textContent='刚刚保存';});
  $('#description').addEventListener('input',()=>$('#saveState').textContent='未保存'); $('#skillBody').addEventListener('input',()=>$('#saveState').textContent='未保存');
  $('#previewSkill').addEventListener('click',()=>$('#runInput').focus());
  $('#runInline').addEventListener('click',()=>{
    const task=$('#runInput').value.trim().toLowerCase(); if(!task){$('#runInput').focus();return;}
    const matched=cards.filter(card=>card.dataset.enabled==='true' && `${card.dataset.skill} ${card.dataset.description} ${card.dataset.uses}`.toLowerCase().split(/[ ,，。/]+/).some(word=>word.length>1&&task.includes(word)));
    const results=matched.length?matched:[selected]; $('#runTags').replaceChildren(...results.map(card=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=card.dataset.skill;return chip;}));
    $('#runOutput').classList.add('show'); notify(`匹配到 ${results.length} 个 Skill`);
  });
  $('#openFolder').addEventListener('click',()=>notify('打开 Skill 文件位置'));
  $('#preferences').addEventListener('click',()=>notify('匹配偏好'));
  $('#moreSkill').addEventListener('click',()=>notify('更多 Skill 操作'));
  $('#backToList').addEventListener('click',()=>workspace.classList.remove('detail-open'));
  document.addEventListener('keydown',event=>{if(event.key==='Escape')workspace.classList.remove('detail-open');});
  renderDetail(cards[0]);
})();
</script>
</body>
</html>
