<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本节点 · 极简样式四方案</title>
<style>
:root{color-scheme:dark;--bg:#111213;--card:#151617;--line:#343638;--muted:#92979b;--text:#e8e9ea;--blue:#79c9ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
.page{max-width:1180px;margin:0 auto;padding:34px 28px 48px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;letter-spacing:.14em}.top h1{font-size:24px;line-height:1.2;margin:5px 0 0;font-weight:650}.hint{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.option{overflow:hidden;background:var(--card);border:1px solid #292b2d;border-radius:14px;transition:border-color .2s,box-shadow .2s}.option.chosen{border-color:var(--blue);box-shadow:0 0 0 1px rgba(121,201,255,.22),0 8px 28px rgba(0,0,0,.18)}
.stage{height:286px;padding:24px;display:grid;place-items:center;position:relative;background-color:#141516;background-image:linear-gradient(rgba(255,255,255,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.027) 1px,transparent 1px);background-size:28px 28px}.demo{width:min(100%,380px);position:relative}.node-name{display:block;width:max-content;max-width:100%;height:24px;margin:0 0 7px;padding:0;border:0;outline:0;background:transparent;color:#dfe2e4;font-family:inherit;font-weight:500;font-size:13px;line-height:24px;letter-spacing:.01em;caret-color:var(--blue)}.node-name:focus{color:#fff}.node-name::placeholder{color:#777d81}.node{position:relative;height:205px;border:1px solid #393b3d;border-radius:10px;background:rgba(27,28,29,.96);transition:border-color .2s,background .2s,box-shadow .2s}.node:focus-within{border-color:#536671}.editor{display:block;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#eceeef;padding:13px 14px;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;caret-color:var(--blue)}
.port{position:absolute;top:50%;z-index:2;width:11px;height:11px;padding:0;border:1.5px solid #8bd0ff;border-radius:50%;background:#1a1c1d;opacity:0;transform:translateY(-50%) scale(.62);box-shadow:0 0 0 0 rgba(121,201,255,0);pointer-events:none;transition:opacity .2s,transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .25s}.port.left{left:-6px}.port.right{right:-6px}.port.visible{opacity:.95;transform:translateY(-50%) scale(1);box-shadow:0 0 0 4px rgba(121,201,255,.09),0 0 13px rgba(121,201,255,.18)}
/* A · soft magnetic response */
.variant-a .port{transition-duration:.24s}
/* B · crisp and quick response */
.variant-b .node{border-radius:7px;background:rgba(27,28,29,.74)}.variant-b .port{width:10px;height:10px;transition-duration:.14s}
/* C · quiet frame with restrained port glow */
.variant-c .node{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.025)}.variant-c .port{width:9px;height:9px;box-shadow:none}.variant-c .port.visible{box-shadow:0 0 0 3px rgba(121,201,255,.06)}
/* D · deeper spring settle */
.variant-d .node{border-color:#424547;background:rgba(25,26,27,.9);border-radius:12px}.variant-d .port{width:12px;height:12px}.variant-d .port.visible{box-shadow:0 0 0 5px rgba(121,201,255,.07),0 0 16px rgba(121,201,255,.23)}
/* Name position is outside the node in every option. */
.variant-b .node-name{margin-left:auto;margin-right:auto;text-align:center}
.variant-c .node-name{font-size:12px;color:#aeb4b8}
.variant-d .node-name{margin-left:auto;text-align:right}
.meta{min-height:75px;padding:13px 15px;display:flex;align-items:center;gap:14px;border-top:1px solid #292b2d}.meta-main{flex:1;min-width:0}.meta h2{font-size:15px;margin:0 0 3px;font-weight:600}.meta p{color:var(--muted);font-size:12px;margin:0}.pick{flex:none;border:1px solid #3a3d3f;color:#d9dcde;background:#202223;border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer;transition:.18s}.pick:hover{border-color:var(--blue);color:#fff}.chosen .pick{background:var(--blue);border-color:var(--blue);color:#111;font-weight:650}.footer{margin-top:14px;color:#81868a;font-size:12px}.footer strong{color:#bac0c4;font-weight:500}
@media(max-width:760px){.page{padding:23px 14px 36px}.top{display:block}.hint{margin-top:10px}.grid{grid-template-columns:1fr}.stage{height:265px;padding:16px}.node{height:195px}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div><div class="eyebrow">NODE STYLE STUDY</div><h1>文本节点 · 极简样式</h1></div><div class="hint">名称可直接编辑 · 靠近侧边查看连接点</div></header>
<section class="grid" aria-label="四种文本节点样式">
<article class="option" data-name="轻柔吸附"><div class="stage"><div class="demo variant-a"><input class="node-name" aria-label="节点名称" value="随手记"><div class="node"><textarea class="editor" aria-label="文本内容" spellcheck="false">一段纯文本内容</textarea><span class="port left"></span><span class="port right"></span></div></div></div><div class="meta"><div class="meta-main"><h2>A · 轻柔吸附</h2><p>名称左对齐，连接点轻柔跟随鼠标。</p></div><button class="pick" type="button">选用此方案</button></div></article>
<article class="option" data-name="快速贴近"><div class="stage"><div class="demo variant-b"><input class="node-name" aria-label="节点名称" value="随手记"><div class="node"><textarea class="editor" aria-label="文本内容" spellcheck="false">一段纯文本内容</textarea><span class="port left"></span><span class="port right"></span></div></div></div><div class="meta"><div class="meta-main"><h2>B · 快速贴近</h2><p>名称居中，连接点迅速显现并吸附。</p></div><button class="pick" type="button">选用此方案</button></div></article>
<article class="option" data-name="弱提示"><div class="stage"><div class="demo variant-c"><input class="node-name" aria-label="节点名称" value="随手记"><div class="node"><textarea class="editor" aria-label="文本内容" spellcheck="false">一段纯文本内容</textarea><span class="port left"></span><span class="port right"></span></div></div></div><div class="meta"><div class="meta-main"><h2>C · 弱提示</h2><p>名称轻淡，连接点以低亮度微动跟随。</p></div><button class="pick" type="button">选用此方案</button></div></article>
<article class="option" data-name="弹性吸附"><div class="stage"><div class="demo variant-d"><input class="node-name" aria-label="节点名称" value="随手记"><div class="node"><textarea class="editor" aria-label="文本内容" spellcheck="false">一段纯文本内容</textarea><span class="port left"></span><span class="port right"></span></div></div></div><div class="meta"><div class="meta-main"><h2>D · 弹性吸附</h2><p>名称右对齐，连接点带轻微弹性与柔光。</p></div><button class="pick" type="button">选用此方案</button></div></article>
</section>
<div class="footer">将鼠标移到节点左右边缘附近，连接点才会渐显并轻轻跟随；名称可直接改写。</div>
</main>
<script>
(function(){
  var follow={a:.12,b:.22,c:.08,d:.28};
  document.querySelectorAll('.demo').forEach(function(demo){
    var node=demo.querySelector('.node');
    var ports={left:node.querySelector('.port.left'),right:node.querySelector('.port.right')};
    var current={left:50,right:50},target={left:50,right:50},frame=0;
    var amount=follow[demo.classList.contains('variant-a')?'a':demo.classList.contains('variant-b')?'b':demo.classList.contains('variant-c')?'c':'d'];
    function animate(){
      var moving=false;
      ['left','right'].forEach(function(side){
        current[side]+=(target[side]-current[side])*.18;
        if(Math.abs(target[side]-current[side])>.08)moving=true;
        ports[side].style.top=current[side]+'%';
      });
      if(moving)frame=requestAnimationFrame(animate);else frame=0;
    }
    node.addEventListener('pointermove',function(event){
      if(event.pointerType==='touch')return;
      var rect=node.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;
      var nearLeft=x<42,nearRight=rect.width-x<42;
      var side=nearLeft?'left':nearRight?'right':null;
      ports.left.classList.toggle('visible',side==='left');
      ports.right.classList.toggle('visible',side==='right');
      if(side){
        var center=rect.height*.5;
        var delta=(y-center)/rect.height*100*amount;
        target[side]=Math.max(38,Math.min(62,50+delta));
      }
      ['left','right'].forEach(function(key){if(key!==side)target[key]=50});
      if(!frame&&(Math.abs(target.left-current.left)>.08||Math.abs(target.right-current.right)>.08))frame=requestAnimationFrame(animate);
    });
    node.addEventListener('pointerleave',function(){ports.left.classList.remove('visible');ports.right.classList.remove('visible');target.left=50;target.right=50;if(!frame)frame=requestAnimationFrame(animate)});
  });
  document.querySelectorAll('.pick').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('.option').forEach(function(option){option.classList.remove('chosen');option.querySelector('.pick').textContent='选用此方案'});var card=button.closest('.option');card.classList.add('chosen');button.textContent='已选方案'})});
})();
</script>
</body>
</html>
