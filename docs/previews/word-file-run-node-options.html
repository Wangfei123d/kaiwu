<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word 文件输入运行节点 · HTML 预览</title>
<style>
:root{color-scheme:dark;--bg:#111213;--panel:#191b1c;--card:#202324;--line:#383c3e;--text:#e8eaeb;--muted:#969da1;--blue:#79c9ff;--word:#4385f5;--green:#8fd3ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.page{max-width:1050px;margin:auto;padding:27px 22px 35px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:.16em}.head h1{font-size:23px;margin:4px 0 0}.head p{margin:0;color:var(--muted);font-size:12px}.switcher{display:flex;gap:6px;margin-bottom:10px}.option{border:1px solid transparent;border-radius:8px;padding:8px 12px;background:transparent;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}.option:hover{background:#1b1e1f;color:var(--text)}.option.active{color:#e2f3ff;border-color:#39586d;background:#1c2a32}.option b{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:5px;border-radius:6px;background:#2c3032;color:var(--blue);font-size:11px}.option.active b{background:var(--blue);color:#101214}.stage{overflow:hidden;border:1px solid #303436;border-radius:13px;background:#141617;box-shadow:0 14px 42px #0004}.toolbar{height:50px;display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid #2d3133;background:var(--panel)}.project{margin-right:auto;color:#aeb4b7;font-size:12px}.project strong{color:var(--text);font-weight:550}.ext{color:#8e969a;font-size:11px}.import{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #4a8bb2;border-radius:7px;background:#79c9ff1c;color:var(--blue);font:inherit;font-size:12px;font-weight:600;cursor:pointer}.import:hover{background:#79c9ff30}.import svg{width:14px;height:14px}.viewport{overflow:auto}.board{position:relative;width:920px;height:480px;overflow:hidden;background-color:#141617;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:22px 22px;transition:background-color .2s}.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.wire-shadow{fill:none;stroke:#79c9ff12;stroke-width:7}.wire{fill:none;stroke:#79c9ff82;stroke-width:1.7;stroke-dasharray:6 6;animation:flow 2.5s linear infinite}.wire-dot{fill:var(--blue);filter:drop-shadow(0 0 4px #79c9ff)}@keyframes flow{to{stroke-dashoffset:-24}}.word-wrap{position:absolute;left:82px;top:160px;width:290px}.outside-name{display:none;margin:0 0 8px 2px;color:#cbd0d3;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.word-card{position:relative;width:290px;min-height:112px;display:flex;align-items:center;gap:13px;padding:14px;border:1px solid #3a3e40;border-radius:10px;background:#1b1d1ef5;box-shadow:0 5px 18px #0003;transition:.18s}.word-card.selected{border-color:var(--blue);box-shadow:0 0 0 1px #79c9ff25,0 7px 22px #0004}.word-icon{flex:none;width:47px;height:50px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#5e9aff,#2869dc);color:white;box-shadow:inset 0 1px #ffffff40,0 4px 12px #347cf533}.word-icon svg{width:37px;height:37px}.file-info{min-width:0;flex:1}.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7eaec;font-size:13px;font-weight:600}.file-meta{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:10px}.docx{color:#8cb8ff;font-weight:700;letter-spacing:.06em}.file-state{margin-left:auto;color:var(--green)}.port{position:absolute;z-index:3;top:50%;width:12px;height:12px;border:1.5px solid var(--blue);border-radius:50%;background:#17191a;box-shadow:0 0 0 3px #79c9ff14;transform:translateY(-50%)}.port.out{right:-7px}.port.in{left:-7px}.run-wrap{position:absolute;left:560px;top:177px;width:190px}.node-title{margin:0 0 8px 2px;color:#dce0e2;font-size:12px}.run-card{position:relative;height:116px;display:flex;align-items:center;justify-content:center;border:1px solid #3a3e40;border-radius:10px;background:#1b1d1ef5;box-shadow:0 5px 18px #0003}.run-button{min-width:102px;padding:9px 16px;border:1px solid #4a8bb2;border-radius:8px;background:#79c9ff1c;color:var(--blue);font:inherit;font-weight:650;cursor:pointer;transition:.15s}.run-button:hover{background:var(--blue);color:#101214}.run-button:active{transform:scale(.97)}.run-state{position:absolute;bottom:14px;color:var(--green);font-size:10px}.run-hint{position:absolute;top:calc(100% + 8px);left:2px;color:#7f888c;font-size:10px}.doc-preview{display:none}.drop-hint{position:absolute;right:24px;bottom:24px;color:#697175;font-size:11px;pointer-events:none}.drop-overlay{position:absolute;inset:12px;z-index:5;display:none;align-items:center;justify-content:center;border:1px dashed var(--blue);border-radius:12px;background:#0f161bd9;color:#e0f2ff;font-size:14px;pointer-events:none}.board.dragging .drop-overlay{display:flex}.caption{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;color:var(--muted);font-size:11px}.caption strong{color:var(--blue);font-weight:550}.caption .tip{margin-left:auto;color:#777f83}.board[data-style="b"] .word-wrap{left:100px;top:151px;width:250px}.board[data-style="b"] .outside-name{display:block}.board[data-style="b"] .word-card{width:250px;min-height:72px;padding:9px 11px;border-radius:8px;background:#191b1bc9;box-shadow:none}.board[data-style="b"] .word-icon{width:36px;height:38px;border-radius:7px}.board[data-style="b"] .word-icon svg{width:29px;height:29px}.board[data-style="b"] .file-name{font-size:12px}.board[data-style="b"] .file-meta{margin-top:3px}.board[data-style="b"] .run-wrap{left:546px;top:177px}.board[data-style="c"] .word-wrap{left:75px;top:127px;width:305px}.board[data-style="c"] .word-card{width:305px;height:155px;align-items:flex-start;padding:13px;border-radius:9px}.board[data-style="c"] .word-icon{width:40px;height:43px}.board[data-style="c"] .file-info{padding-top:2px}.board[data-style="c"] .doc-preview{position:absolute;left:65px;right:14px;bottom:13px;display:grid;gap:5px}.doc-preview i{height:3px;border-radius:3px;background:#4a4e50}.doc-preview i:nth-child(2){width:88%}.doc-preview i:nth-child(3){width:68%}.doc-preview i:nth-child(4){width:80%}.board[data-style="c"] .run-wrap{left:570px;top:177px}.board[data-style="d"] .word-wrap{left:104px;top:180px;width:330px}.board[data-style="d"] .word-wrap .outside-name{display:none}.board[data-style="d"] .word-card{width:330px;min-height:63px;padding:8px 10px;border-radius:8px;background:#1a1c1cc2;box-shadow:none}.board[data-style="d"] .word-icon{width:33px;height:35px;border-radius:7px}.board[data-style="d"] .word-icon svg{width:27px;height:27px}.board[data-style="d"] .file-meta{margin-top:2px}.board[data-style="d"] .run-wrap{left:590px;top:177px}.board[data-style="d"] .run-card{height:100px;border-radius:999px}
@media(max-width:680px){.page{padding:20px 12px}.head{display:block}.head p{margin-top:8px}.switcher{overflow:auto}.option{flex:none}.ext{display:none}.caption .tip{display:none}}
</style>
</head>
<body>
<main class="page">
  <header class="head"><div><div class="eyebrow">WORD INPUT NODE OPTIONS</div><h1>Word 文件接入运行节点</h1></div><p>选择节点样式 · 将 DOCX 正文作为文本输入运行</p></header>
  <nav class="switcher" aria-label="Word 节点样式">
    <button class="option active" data-style="a" type="button"><b>A</b>标准卡片</button>
    <button class="option" data-style="b" type="button"><b>B</b>名称外置</button>
    <button class="option" data-style="c" type="button"><b>C</b>正文预览</button>
    <button class="option" data-style="d" type="button"><b>D</b>极简条目</button>
  </nav>
  <section class="stage" aria-label="Word 文件节点与运行节点">
    <div class="toolbar"><div class="project"><strong>短剧画布</strong>　/　我的项目</div><span class="ext">支持 Word 2007+　.docx</span><button class="import" id="importButton" type="button"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7m0 0 2.7-2.7M8 9.5 5.3 6.8M3 10.8v2.1h10v-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>导入 Word</button><input id="picker" type="file" accept=".docx" hidden></div>
    <div class="viewport"><div class="board" id="board" data-style="a">
      <svg class="wires" id="wires" viewBox="0 0 920 480" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="word-wrap"><div class="outside-name" id="outsideName"></div><div class="word-card selected" id="wordCard" tabindex="0"><span class="word-icon"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 10h7l3.2 14.2L19.1 10h4.2l4 14.2L30.5 10H36l-6.3 20h-5.1l-3.5-12.1L17.5 30h-5.1L5 10Z" fill="white"/></svg></span><span class="file-info"><span class="file-name" id="fileName">项目实施方案.docx</span><span class="file-meta"><span class="docx">DOCX</span><span id="fileSize">84 KB</span><span class="file-state">正文可读取</span></span></span><span class="doc-preview"><i></i><i></i><i></i><i></i></span><span class="port out" id="outPort" aria-hidden="true"></span></div></div>
      <div class="run-wrap"><div class="node-title">运行</div><div class="run-card"><span class="port in" id="inPort" aria-hidden="true"></span><button class="run-button" id="runButton" type="button">运行</button><span class="run-state" id="runState">已就绪</span></div><div class="run-hint">输入：DOCX 正文文本</div></div>
      <div class="drop-hint">拖入 .docx 文件可替换文档</div><div class="drop-overlay">松开鼠标，载入 Word 文档</div>
    </div></div>
    <div class="caption"><strong id="captionTitle">方案 A · 标准卡片</strong><span id="captionText">Word 图标、文件名与格式信息清楚并列。</span><span class="tip">旧版 .doc 请先另存为 .docx</span></div>
  </section>
</main>
<script>
(()=>{const board=document.querySelector('#board'),picker=document.querySelector('#picker'),card=document.querySelector('#wordCard'),wires=document.querySelector('#wires');const captions={a:['方案 A · 标准卡片','Word 图标、文件名与格式信息清楚并列。'],b:['方案 B · 名称外置','文件名放在卡片外，节点内部更紧凑。'],c:['方案 C · 正文预览','卡片底部用短线表示可读取的正文内容。'],d:['方案 D · 极简条目','小图标与单行信息，减少画布占用。']};function drawWire(){const a=document.querySelector('#outPort').getBoundingClientRect(),b=document.querySelector('#inPort').getBoundingClientRect(),r=board.getBoundingClientRect();const x1=a.left-r.left+a.width/2,y1=a.top-r.top+a.height/2,x2=b.left-r.left+b.width/2,y2=b.top-r.top+b.height/2,bend=Math.max(34,(x2-x1)*.48),d=`M ${x1} ${y1} C ${x1+bend} ${y1}, ${x2-bend} ${y2}, ${x2} ${y2}`;wires.replaceChildren();for(const cls of ['wire-shadow','wire']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class',cls);p.setAttribute('d',d);wires.append(p)}const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('class','wire-dot');dot.setAttribute('cx',x2);dot.setAttribute('cy',y2);dot.setAttribute('r','2.5');wires.append(dot)}function size(n){return n<1024?n+' B':n<1024*1024?Math.round(n/1024)+' KB':(n/1024/1024).toFixed(1)+' MB'}function setFile(file){document.querySelector('#fileName').textContent=file.name;document.querySelector('#outsideName').textContent=file.name;document.querySelector('#fileSize').textContent=size(file.size);document.querySelector('#runState').textContent='已就绪';card.classList.add('selected');drawWire()}function toast(s){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;border:1px solid #3b4347;border-radius:8px;background:#202426;color:#dceefa;font-size:12px;z-index:10';document.body.append(t)}t.textContent=s;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',2100)}document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x===btn));board.dataset.style=btn.dataset.style;document.querySelector('#captionTitle').textContent=captions[btn.dataset.style][0];document.querySelector('#captionText').textContent=captions[btn.dataset.style][1];requestAnimationFrame(drawWire)}));document.querySelector('#importButton').addEventListener('click',()=>picker.click());picker.addEventListener('change',e=>{const f=e.target.files?.[0];if(f){if(!/\.docx$/i.test(f.name))toast('目前预览只接受 .docx 文件');else setFile(f)}picker.value=''});board.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer?.items??[]).some(i=>i.kind==='file')){e.preventDefault();board.classList.add('dragging')}});board.addEventListener('dragleave',e=>{if(!board.contains(e.relatedTarget))board.classList.remove('dragging')});board.addEventListener('drop',e=>{e.preventDefault();board.classList.remove('dragging');const f=Array.from(e.dataTransfer?.files??[]).find(x=>/\.docx$/i.test(x.name));if(f)setFile(f);else toast('请选择 Word .docx 文件')});document.querySelector('#runButton').addEventListener('click',()=>{const state=document.querySelector('#runState');state.textContent='正在读取正文…';setTimeout(()=>{state.textContent='已就绪';toast('预览展示文件接线；运行时会抽取 DOCX 正文作为提示词')},750)});card.addEventListener('click',()=>card.classList.toggle('selected'));window.addEventListener('resize',()=>requestAnimationFrame(drawWire));requestAnimationFrame(drawWire)})();
</script>
</body>
</html>
