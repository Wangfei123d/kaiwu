<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPS 文件节点预览</title>
<style>
:root{color-scheme:dark;--bg:#111213;--surface:#191b1c;--card:#202324;--line:#363a3c;--text:#e8eaeb;--muted:#969da1;--blue:#79c9ff;--red:#e64f45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.page{max-width:1050px;margin:auto;padding:28px 22px 36px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:.16em}.head h1{font-size:23px;margin:4px 0 0}.head p{color:var(--muted);font-size:12px;margin:0}.switcher{display:flex;gap:6px;margin-bottom:10px}.option{border:1px solid transparent;border-radius:8px;padding:8px 12px;background:transparent;color:var(--muted);font:inherit;cursor:pointer}.option:hover{background:#1b1e1f;color:var(--text)}.option.active{color:#dceefa;border-color:#39586d;background:#1c2a32}.option b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;margin-right:5px;background:#2c3032;color:var(--blue);font-size:11px}.option.active b{background:var(--blue);color:#101214}.stage{overflow:hidden;border:1px solid #303436;border-radius:13px;background:#141617;box-shadow:0 14px 42px #0004}.toolbar{height:50px;display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid #2d3133;background:var(--surface)}.project{margin-right:auto;color:#aeb4b7;font-size:12px}.project strong{color:var(--text);font-weight:550}.exts{color:#8c9498;font-size:11px}.import{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #4a8bb2;border-radius:7px;background:#79c9ff1c;color:var(--blue);font:inherit;font-size:12px;font-weight:600;cursor:pointer}.import:hover{background:#79c9ff30}.import svg{width:14px;height:14px}.viewport{overflow:auto}.board{position:relative;min-width:680px;height:430px;background-color:#141617;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:22px 22px;transition:background-color .2s}.files{position:absolute;left:74px;top:70px;display:flex;flex-direction:column;gap:20px}.file{position:relative;width:300px;min-height:82px;padding:12px;display:flex;align-items:center;gap:12px;border:1px solid #3a3e40;border-radius:10px;background:#1b1d1ef5;box-shadow:0 5px 18px #0003;cursor:pointer;text-align:left;transition:.17s}.file:hover{border-color:#53616a;transform:translateY(-1px)}.file.selected{border-color:var(--blue);box-shadow:0 0 0 1px #79c9ff29,0 7px 22px #0004}.icon{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#f36b5c,#d83c31);color:#fff;box-shadow:inset 0 1px #ffffff30,0 3px 10px #e24b3f30}.icon svg{width:31px;height:31px}.copy{min-width:0;flex:1}.name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e7e8;font-size:13px;font-weight:550}.meta{display:flex;gap:8px;margin-top:4px;color:var(--muted);font-size:10px}.format{color:#ef867c;font-weight:650;letter-spacing:.03em}.outside{position:absolute;left:1px;top:-22px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b9bec1;font-size:12px}.drop{position:absolute;right:30px;bottom:25px;color:#697175;font-size:11px;pointer-events:none}.overlay{position:absolute;inset:12px;display:none;align-items:center;justify-content:center;border:1px dashed var(--blue);border-radius:12px;background:#0f161bd9;color:#dceefa;font-size:14px;pointer-events:none}.board.dragging .overlay{display:flex}.caption{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 14px;color:var(--muted);font-size:11px}.caption strong{color:var(--blue);font-weight:550}.caption .tip{margin-left:auto;color:#777f83}.board[data-style="b"] .files{left:104px;top:77px;gap:25px}.board[data-style="b"] .file{width:255px;min-height:68px;padding:9px 11px;border-radius:8px;background:#191b1bc9;box-shadow:none}.board[data-style="b"] .icon{width:34px;height:34px;border-radius:8px}.board[data-style="b"] .icon svg{width:26px;height:26px}.board[data-style="b"] .outside{top:-21px}.board[data-style="c"] .files{left:64px;top:57px;gap:16px}.board[data-style="c"] .file{width:320px;height:112px;align-items:flex-start;padding:12px;border-radius:9px}.board[data-style="c"] .icon{width:36px;height:36px}.board[data-style="c"] .lines{position:absolute;left:60px;right:13px;bottom:12px;display:grid;gap:5px}.lines i{height:3px;border-radius:3px;background:#45494b}.lines i:nth-child(2){width:82%}.lines i:nth-child(3){width:58%}.board[data-style="d"] .files{left:102px;top:106px;gap:13px}.board[data-style="d"] .file{width:350px;min-height:58px;padding:8px 10px;border-radius:8px;background:#1b1d1dbd;box-shadow:none}.board[data-style="d"] .icon{width:30px;height:30px;border-radius:7px}.board[data-style="d"] .icon svg{width:23px;height:23px}.board[data-style="d"] .meta{margin-top:1px}.board[data-style="d"] .outside{display:none}
@media(max-width:700px){.page{padding:20px 12px}.head{display:block}.head p{margin-top:8px}.switcher{overflow:auto}.option{flex:none}.exts{display:none}.caption .tip{display:none}}
</style>
</head>
<body>
<main class="page">
<header class="head"><div><div class="eyebrow">CANVAS FILE NODE OPTIONS</div><h1>WPS 文件节点</h1></div><p>文件作为独立素材节点导入，双击或右键可打开原文件</p></header>
<nav class="switcher" aria-label="节点样式"><button class="option active" data-style="a"><b>A</b>标准卡片</button><button class="option" data-style="b"><b>B</b>轻量图标</button><button class="option" data-style="c"><b>C</b>文档卡片</button><button class="option" data-style="d"><b>D</b>极简条目</button></nav>
<section class="stage"><div class="toolbar"><div class="project"><strong>短剧画布</strong>　/　我的项目</div><span class="exts">.wps　.et　.dps　.wpt　.docx　.xlsx　.pptx</span><button class="import" id="importButton"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7m0 0 2.7-2.7M8 9.5 5.3 6.8M3 10.8v2.1h10v-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>导入文件</button><input id="picker" type="file" multiple accept=".wps,.et,.dps,.wpt,.ett,.dpt,.docx,.xlsx,.pptx" hidden></div>
<div class="viewport"><div class="board" id="board" data-style="a"><div class="files" id="files"></div><div class="drop">拖放 WPS / Office 文件到画布</div><div class="overlay">松开鼠标，将文件作为素材节点导入</div></div></div>
<div class="caption"><strong id="captionTitle">A · 标准卡片</strong><span id="captionText">图标、文件名和格式信息清楚并列。</span><span class="tip">双击或右键打开原文件</span></div></section>
</main>
<script>
(()=>{const board=document.querySelector('#board'),list=document.querySelector('#files'),picker=document.querySelector('#picker');const allowed=/\.(wps|et|dps|wpt|ett|dpt|docx|xlsx|pptx)$/i;const styles={a:['A · 标准卡片','图标、文件名和格式信息清楚并列。'],b:['B · 轻量图标','压缩尺寸，减少节点在画布中的占用。'],c:['C · 文档卡片','宽卡片增加文档线条预览感。'],d:['D · 极简条目','小图标与单行文件信息，适合大量文件。']};let files=[{name:'分镜脚本.wps',size:248*1024},{name:'场景资料.et',size:86*1024}],active=0;function icon(){return '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6.5 10.5h4.6l3.1 14.2 3.1-10.4h3.6L24 24.7l3.1-14.2h4.7l-5.4 19h-4.5l-2.8-9.3-2.8 9.3h-4.5l-5.3-19Z" fill="white"/></svg>'}function size(n){return n<1024?n+' B':(n/1024).toFixed(n<10240?1:0)+' KB'}function draw(){list.replaceChildren();files.forEach((f,i)=>{const n=document.createElement('button');n.className='file'+(i===active?' selected':'');n.type='button';n.title='双击或右键打开原文件';const outside=document.createElement('span');outside.className='outside';outside.textContent=f.name;const iconBox=document.createElement('span');iconBox.className='icon';iconBox.innerHTML=icon();const copy=document.createElement('span');copy.className='copy';const name=document.createElement('span');name.className='name';name.textContent=f.name;const meta=document.createElement('span');meta.className='meta';const ext=document.createElement('span');ext.className='format';ext.textContent=f.name.split('.').pop().toUpperCase();const bytes=document.createElement('span');bytes.textContent=size(f.size);meta.append(ext,bytes);copy.append(name,meta);n.append(outside,iconBox,copy);if(board.dataset.style==='c'){const lines=document.createElement('span');lines.className='lines';lines.innerHTML='<i></i><i></i><i></i>';n.append(lines)}n.addEventListener('click',()=>{active=i;draw()});n.addEventListener('dblclick',()=>toast('在开物中双击文件节点会调用系统关联应用打开'));n.addEventListener('contextmenu',e=>{e.preventDefault();toast('右键菜单可选择“打开文件”')});list.append(n)});board.style.height=Math.max(430,130+files.length*(board.dataset.style==='c'?128:105))+'px'}function toast(text){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;border:1px solid #3b4347;border-radius:8px;background:#202426;color:#dceefa;font-size:12px;z-index:10';document.body.append(t)}t.textContent=text;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',1800)}document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x===b));board.dataset.style=b.dataset.style;document.querySelector('#captionTitle').textContent=styles[b.dataset.style][0];document.querySelector('#captionText').textContent=styles[b.dataset.style][1];draw()}));function add(incoming){const accepted=Array.from(incoming||[]).filter(f=>allowed.test(f.name));if(!accepted.length){toast('请选择支持的 WPS / Office 格式文件');return}files.push(...accepted.map(f=>({name:f.name,size:f.size})));active=files.length-1;draw()}document.querySelector('#importButton').addEventListener('click',()=>picker.click());picker.addEventListener('change',e=>{add(e.target.files);picker.value=''});board.addEventListener('dragover',e=>{e.preventDefault();board.classList.add('dragging')});board.addEventListener('dragleave',e=>{if(!board.contains(e.relatedTarget))board.classList.remove('dragging')});board.addEventListener('drop',e=>{e.preventDefault();board.classList.remove('dragging');add(e.dataTransfer.files)});draw()})();
</script>
</body>
</html>
